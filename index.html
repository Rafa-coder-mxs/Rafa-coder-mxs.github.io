<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rafael Oliveira · Jogos</title>
  <style>
    :root { --fundo: #fbf3e4; --texto: #2a1a12; --suave: #6b5446; --destaque: #c8462b; }
    @media (prefers-color-scheme: dark) { :root { --fundo: #1f1712; --texto: #f3e7d6; --suave: #c2ad98; --destaque: #ff8a5c; } }
    body { margin: 0; background: var(--fundo); color: var(--texto); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 40px 16px; }
    h1 { font-size: 1.6rem; margin: 0 0 1.5rem; }
    a { color: var(--destaque); }
    .jogo h2 { margin: 0; font-size: 1.2rem; }
    .jogo p { margin: .3rem 0; color: var(--suave); }
  </style>
</head>
<body>
<main>
  <h1>Jogos de Rafael Oliveira</h1>
  <div class="jogo">
    <h2>Cortador Arretado</h2>
    <p>Corte cuscuz, caju e tapioca e fuja da bombinha! O jogo de corte do Nordeste. Em breve para Android.</p>
    <p><a href="cortador-arretado/privacidade/">Política de privacidade</a></p>
  </div>
</main>
</body>
</html>
